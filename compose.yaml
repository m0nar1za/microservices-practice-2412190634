name: grocery-microservices

services:
  user-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
    volumes:
      - user-data:/var/lib/mysql
    networks:
      - grocery-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  product-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: product_db
    volumes:
      - product-data:/var/lib/mysql
    networks:
      - grocery-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  order-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: order_db
    volumes:
      - order-data:/var/lib/mysql
    networks:
      - grocery-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://user-db:3306/user_db
      DB_PASSWORD: ${USER_DB_PASSWORD}
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - grocery-net

  product-service:
    build: ./services/product-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://product-db:3306/product_db
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - grocery-net

  order-service:
    build: ./services/order-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://order-db:3306/order_db
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - grocery-net

volumes:
  user-data:
  product-data:
  order-data:

networks:
  grocery-net:
